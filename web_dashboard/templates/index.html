<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Server Room Guardian Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.3); max-width: 500px; width: 100%; }
        h1 { color: #38bdf8; font-size: 24px; }
        .metric { font-size: 48px; font-weight: bold; margin: 20px 0; color: #f43f5e; }
        .status { font-size: 18px; padding: 10px; border-radius: 6px; background: #334155; margin-bottom: 20px; }
        .footer { font-size: 12px; color: #94a3b8; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Server Room Guardian</h1>
        <p>Live Thermal Telemetry & Fan Control</p>
        <div class="metric">{{ temp }}°C</div>
        <div class="status">Fan Status: <strong>{{ fan_status }}</strong></div>
        <hr style="border: 0; border-top: 1px solid #334155;">
        <p class="footer">Autonomous System Daemon: Running via systemd</p>
    </div>
</body>
</html>
